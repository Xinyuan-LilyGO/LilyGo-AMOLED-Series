name: PlatformIO CI

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "examples/**"
      - "src/**"
      - "libdeps/**"
      - "library.json"
      - "library.properties"
      - "platformio.ini"
      - ".github/workflows/platformio.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        examples:
          - examples/AdjustBrightness
          - examples/Arduino_GFX_HelloWorld
          - examples/Arduino_GFX_PDQgraphicstest
          - examples/DS18x20_Temperature
          - examples/Factory
          - examples/FactoryV2
          - examples/IR_RX_Test
          - examples/IR_TX_Test
          - examples/Lvgl_Images
          - examples/LVGL_SD_Images
          - examples/LumenMeter
          - examples/PMU_ADC
          - examples/PPM_Example_for_191Plus
          - examples/PPM_Example_for_T4S3
          - examples/SPI_SDCard
          - examples/PMU_Interrupt
          - examples/PlayMP3FromPROGMEM
          - examples/CameraShield
          - examples/QWIIC_GPS_Shield
          - examples/QWIIC_HP303BSensor
          - examples/QWIIC_I2C_Scan
          - examples/QWIIC_MAX3010X
          - examples/TFT_eSPI_Sprite
          - examples/TFT_eSPI_Sprite_ArcFill
          - examples/TFT_eSPI_Sprite_graphicstest_small
          - examples/TFT_eSPI_Sprite_RLE_Font
          - examples/Touchpad
          - examples/TouchPaint
          - examples/LVGL_Rotation
          - examples/TFT_eSPI_Sprite_Rotation
          - examples/TWAI_SelfTest
          - examples/USB_Host_Keyboard_Mouse
          - examples/lvgl_version_9

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run PlatformIO
        run: |
          environment="T-Display-AMOLED"
          case "${{ matrix.examples }}" in
            examples/Arduino_GFX_*) environment="T-Display-AMOLED-191-ArduinoGFX" ;;
            examples/IR_RX_Test|examples/IR_TX_Test) environment="IRTest" ;;
            examples/USB_Host_Keyboard_Mouse) environment="T-Display-AMOLED-USB-HOST" ;;
          esac
          PLATFORMIO_SRC_DIR="${{ matrix.examples }}" pio run -e "$environment"
